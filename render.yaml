# Render Blueprint — provisions the GameSquad backend + a free Postgres DB.
# In Render: New + -> Blueprint -> connect this repo -> Apply.
databases:
  - name: gamesquad-db
    plan: free
    databaseName: gamesquad
    user: gamesquad

services:
  - type: web
    name: gamesquad-api
    runtime: python
    plan: free
    rootDir: backend
    # Python version comes from backend/.python-version (3.13).
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed && python manage.py ensure_superuser"
    startCommand: "gunicorn config.wsgi --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gamesquad-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://gamesquad-three.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://gamesquad-three.vercel.app"
      # Admin login for the app's admin section + Django /admin.
      - key: ADMIN_USERNAME
        value: "admin"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: "admin@gamesquad.gg"
      # AI providers. Model names are safe to commit; the API keys are NOT —
      # sync:false means Render asks you to paste them in the dashboard, so
      # they never live in git. Leave them blank to run in heuristic mode.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "meta-llama/llama-3.3-70b-instruct"
